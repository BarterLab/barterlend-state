[package]
name = "barterlend-state"
version = "0.1.0"
license = "MIT"
edition = "2024"
rust-version = "1.98"
description = "Read-only, block-consistent borrower state SDK for BarterLend protocol v5"
publish = false

[dependencies]
alloy-primitives = { version = "=1.5.7", features = ["serde", "rlp"] }
alloy-sol-types = { version = "=1.5.7", features = ["json"] }
async-trait = "=0.1.89"
futures-util = "=0.3.32"
reqwest = { version = "=0.13.3", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"
tokio = { version = "=1.53.3", features = ["sync", "time", "macros", "rt-multi-thread"] }
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"

